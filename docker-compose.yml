# Déploiement cible : serveur Linux headless (Debian recommandé) avec Docker
# + Compose. Aucune dépendance à un poste de développement particulier :
# ce fichier fonctionne à l'identique sur n'importe quel hôte Docker.
#
# Démarrage :
#   cp .env.example .env   # puis éditer les valeurs (mots de passe, secret)
#   docker compose up -d --build
#
# Stockage, conformément à la règle "fichiers séparés de la base" :
#   - db_data              : volume nommé, données PostgreSQL
#   - ./data/documents     : bind mount hôte (service app), documents/
#     justificatifs uploadés (jamais en base) — même dossier physique qu'en
#     `npm run dev` (voir DOCUMENTS_DIR dans .env), pour ne jamais avoir deux
#     stockages divergents selon le mode d'exécution. Migration vers un NAS
#     plus tard = changer uniquement ce chemin source.
#   - n8n_data              : volume nommé, données internes n8n

services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB manquant}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # uid/gid de l'utilisateur hôte qui lance `npm run dev` (voir .env,
    # DOCUMENTS_DIR=./data/documents) : l'image officielle node fournit déjà
    # un user "node" à ce même uid/gid, donc les fichiers créés par le
    # conteneur (dossiers PDF générés, uploads) restent modifiables sans
    # sudo côté hôte, sur le même dossier que le mode dev.
    user: "1000:1000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public"
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET manquant}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL manquant}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD manquant}
      ADMIN_NOM: ${ADMIN_NOM:-Administrateur}
      ADMIN_PRENOM: ${ADMIN_PRENOM:-Compte}
      DOCUMENTS_DIR: /data/documents
      NODE_ENV: production
      PORT: "3000"
      # Bearer token des routes /api/internal/n8n/* (voir lib/auth-n8n.ts) :
      # optionnel, ces routes refusent tout tant qu'il n'est pas défini, sans
      # empêcher l'app de démarrer ni de fonctionner normalement.
      N8N_INTERNAL_API_SECRET: ${N8N_INTERNAL_API_SECRET:-}
      # Optionnel : IP/nom réellement joignable depuis un téléphone en salle
      # pour l'URL encodée dans le QR d'accès (voir .env.example). Vide par
      # défaut : le fallback détecté depuis la requête HTTP est utilisé.
      PUBLIC_HOST: ${PUBLIC_HOST:-}
      # Le conteneur tourne en UTC par défaut : sans ce réglage, « aujourd'hui »
      # côté serveur bascule à minuit UTC, soit 2h du matin à Paris en été.
      # Les séances du jour et le délai de correction des présences seraient
      # alors calculés sur le mauvais jour.
      TZ: ${TZ:-Europe/Paris}
    ports:
      - "3000:3000"
    # Bind mount plutôt que volume nommé : même dossier physique qu'en
    # `npm run dev` (DOCUMENTS_DIR=./data/documents), pour ne plus avoir deux
    # stockages de documents divergents selon le mode d'exécution (voir audit
    # du 2026-08-31). Migration vers un NAS plus tard = changer uniquement ce
    # chemin source, sans toucher au code. L'ancien volume nommé app_data
    # reste déclaré plus bas (non supprimé, simplement plus utilisé).
    volumes:
      - ./data/documents:/data/documents

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - TZ=${TZ:-Europe/Paris}
      # Même valeur que côté app : les workflows appellent l'app via
      # /api/internal/n8n/* avec ce Bearer token (header Authorization),
      # jamais un accès direct à Postgres ni au volume app_data.
      - N8N_INTERNAL_API_SECRET=${N8N_INTERNAL_API_SECRET:-}
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  db_data:
  n8n_data:
