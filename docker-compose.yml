# Déploiement cible : serveur Linux headless (Debian recommandé) avec Docker
# + Compose. Aucune dépendance à un poste de développement particulier :
# ce fichier fonctionne à l'identique sur n'importe quel hôte Docker.
#
# Démarrage :
#   cp .env.example .env   # puis éditer les valeurs (mots de passe, secret)
#   docker compose up -d --build
#
# Stockage, conformément à la règle "fichiers séparés de la base" :
#   - db_data              : volume nommé, données PostgreSQL
#   - ./data/documents     : bind mount hôte (service app), documents/
#     justificatifs uploadés (jamais en base) — même dossier physique qu'en
#     `npm run dev` (voir DOCUMENTS_DIR dans .env), pour ne jamais avoir deux
#     stockages divergents selon le mode d'exécution. Migration vers un NAS
#     plus tard = changer uniquement ce chemin source.
#   - n8n_data              : volume nommé, données internes n8n

services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB manquant}
    volumes:
      - db_data:/var/lib/postgresql/data
    # Lié à 127.0.0.1 uniquement (jamais 0.0.0.0) : Postgres n'a besoin
    # d'être joignable que par le conteneur `app` (réseau interne Docker,
    # toujours accessible sans ports:) et, ponctuellement, par un accès
    # direct depuis l'hôte (ex. npm run db:studio en dev). Publier ce port
    # sur toutes les interfaces l'exposerait sur le réseau local — et, une
    # fois le tunnel public de la préinscription en place, potentiellement
    # au-delà — sans aucun rapport avec le besoin (voir audit de sécurité de
    # la préinscription publique, ARCHITECTURE-PREINSCRIPTION.md).
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # uid/gid de l'utilisateur hôte qui lance `npm run dev` (voir .env,
    # DOCUMENTS_DIR=./data/documents) : l'image officielle node fournit déjà
    # un user "node" à ce même uid/gid, donc les fichiers créés par le
    # conteneur (dossiers PDF générés, uploads) restent modifiables sans
    # sudo côté hôte, sur le même dossier que le mode dev. Gardé tel quel
    # (jamais passé à 1001, l'uid du montage NAS) car le Dockerfile chown
    # /app vers node:node (1000:1000) au build pour le cache Next.js — voir
    # sa note "constaté en production le 2026-09-08".
    user: "1000:1000"
    # Groupe supplémentaire correspondant à l'uid/gid du montage CIFS du NAS
    # (voir /etc/fstab sur l'hôte : uid=1001,gid=1001,dir_mode=0770). Les
    # partages sont montés par l'utilisateur "admin-asso" (1001) ; sans ce
    # group_add, le conteneur (uid 1000, non membre du groupe 1001) reçoit un
    # Permission denied sur les 3 bind mounts ci-dessous — vérifié par un
    # test dédié (audit du 2026-09-09) avant d'adopter cette solution plutôt
    # qu'un chown/remount qui aurait cassé l'accès hôte ou le cache Next.js.
    group_add:
      - "1001"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public"
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET manquant}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL manquant}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD manquant}
      ADMIN_NOM: ${ADMIN_NOM:-Administrateur}
      ADMIN_PRENOM: ${ADMIN_PRENOM:-Compte}
      DOCUMENTS_DIR: /data/documents
      NODE_ENV: production
      PORT: "3000"
      # Bearer token des routes /api/internal/n8n/* (voir lib/auth-n8n.ts) :
      # optionnel, ces routes refusent tout tant qu'il n'est pas défini, sans
      # empêcher l'app de démarrer ni de fonctionner normalement.
      N8N_INTERNAL_API_SECRET: ${N8N_INTERNAL_API_SECRET:-}
      # Optionnel : IP/nom réellement joignable depuis un téléphone en salle
      # pour l'URL encodée dans le QR d'accès (voir .env.example). Vide par
      # défaut : le fallback détecté depuis la requête HTTP est utilisé.
      PUBLIC_HOST: ${PUBLIC_HOST:-}
      # Cloisonnement par hostname du tunnel public de préinscription (voir
      # .env.example et src/proxy.ts) : vide par défaut, sans effet tant que
      # le tunnel n'est pas en place.
      PREINSCRIPTION_PUBLIC_HOSTNAME: ${PREINSCRIPTION_PUBLIC_HOSTNAME:-}
      # Le conteneur tourne en UTC par défaut : sans ce réglage, « aujourd'hui »
      # côté serveur bascule à minuit UTC, soit 2h du matin à Paris en été.
      # Les séances du jour et le délai de correction des présences seraient
      # alors calculés sur le mauvais jour.
      TZ: ${TZ:-Europe/Paris}
      # Même raison que DATABASE_URL ci-dessus : recalculée vers le nom de
      # service Docker "documenso" (port interne 3000), jamais vers
      # DOCUMENSO_API_URL tel quel (qui, dans .env, cible localhost:3100 —
      # correct pour un outil lancé depuis l'hôte, mais désignerait ce
      # conteneur "app" lui-même vu de l'intérieur, pas Documenso).
      DOCUMENSO_API_URL: "http://documenso:3000/api/v1"
      DOCUMENSO_API_TOKEN: ${DOCUMENSO_API_TOKEN:?DOCUMENSO_API_TOKEN manquant}
      DOCUMENSO_WEBHOOK_SECRET: ${DOCUMENSO_WEBHOOK_SECRET:?DOCUMENSO_WEBHOOK_SECRET manquant}
    # Lié à 127.0.0.1 uniquement (jamais 0.0.0.0) : le tunnel Cloudflare
    # (service `cloudflared` ci-dessous) joint ce service via le réseau
    # Docker interne (hostname "app", port 3000 du conteneur), jamais via ce
    # port publié sur l'hôte — donc aucun impact sur /preinscription public.
    # Publier sur toutes les interfaces exposait l'app en clair sur le
    # réseau local sans aucun besoin (même raison que db.ports/n8n.ports).
    # TEMPORAIRE (test LAN) : ouvert sur toutes les interfaces le temps du
    # test — remettre "127.0.0.1:3000:3000" ensuite.
    ports:
      - "3000:3000"
    # Stockage documentaire actif migré vers le NAS (audit du 2026-09-09) :
    # aucun changement de code nécessaire, DOCUMENTS_DIR (voir src/lib/documents.ts)
    # ne connaît que des chemins relatifs opaques ("etudiants/<id>/...",
    # "association/...", et l'historique "organisation/logo.png") — seule la
    # racine physique change. Trois bind mounts distincts (et non un seul sur
    # DOCUMENTS_DIR) pour respecter la séparation Étudiant/Administration
    # voulue côté NAS, chacun vers le sous-dossier attendu par le code :
    #   - etudiants/    -> partage NAS "Etudiant"
    #   - organisation/ -> partage NAS "Administration" (logo, chemin hérité)
    #   - association/  -> partage NAS "Administration" (PV/statuts/RI, cible
    #                       actuelle de enregistrerDocumentAssociation)
    # Sauvegardes-Oree (scripts/backup.sh) reste un dossier frère, jamais
    # monté ici : le stockage documentaire applicatif et les sauvegardes
    # restent deux choses distinctes même si elles vivent sur le même NAS.
    # L'ancien bind mount local (./data/documents) est conservé sur disque
    # (non supprimé) comme filet de sécurité, mais n'est plus monté ici.
    volumes:
      - /mnt/nas/Etudiant/etudiants:/data/documents/etudiants
      - /mnt/nas/Administration/organisation:/data/documents/organisation
      - /mnt/nas/Administration/association:/data/documents/association

  # Connecteur du tunnel Cloudflare existant "oree-preinscription" (voir
  # CONFIGURATION-CLOUDFLARE-PREINSCRIPTION.md) : c'est lui qui rend
  # /preinscription et /dossier/* joignables depuis Internet sans ouvrir
  # aucun port entrant sur ce serveur — le tunnel et le hostname public sont
  # configurés côté Cloudflare Zero Trust, ce service ne fait que faire
  # tourner le connecteur. Documenté ici pour que la stack soit reconstructible
  # depuis ce dépôt (voir audit du 2026-09-08) ; ne crée, ne modifie ni ne
  # remplace aucun tunnel/DNS/hostname/token. Le token reste exclusivement
  # dans .env (jamais dans Git, voir .env.example).
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    depends_on:
      - app
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN manquant}

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    # Lié à 127.0.0.1 uniquement, même raison que db.ports ci-dessus : n8n
    # n'a besoin d'être joignable que par l'app (réseau interne Docker) et,
    # pour son interface d'administration, par le staff sur la machine hôte
    # elle-même (ou via un tunnel/VPN dédié, hors du scope réseau public de
    # la préinscription). Aucun besoin d'exposition sur toutes les
    # interfaces (voir audit de sécurité de la préinscription publique).
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - TZ=${TZ:-Europe/Paris}
      # Même valeur que côté app : les workflows appellent l'app via
      # /api/internal/n8n/* avec ce Bearer token (header Authorization),
      # jamais un accès direct à Postgres ni au volume app_data.
      - N8N_INTERNAL_API_SECRET=${N8N_INTERNAL_API_SECRET:-}
    volumes:
      - n8n_data:/home/node/.n8n

  # --- Documenso self-hébergé (signature électronique des dossiers) ---
  # Base Postgres et stockage (MinIO) dédiés, isolés de `db` (Postgres de
  # l'application) : Documenso gère son propre schéma Prisma, aucune raison
  # de le mélanger avec les données métier. Voir src/lib/documenso.ts pour
  # le client API utilisé par l'application (jamais l'inverse : Documenso ne
  # touche jamais Postgres/le stockage de l'application — même principe que
  # n8n, voir CLAUDE.md).
  documenso-db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DOCUMENSO_POSTGRES_USER:?DOCUMENSO_POSTGRES_USER manquant}
      POSTGRES_PASSWORD: ${DOCUMENSO_POSTGRES_PASSWORD:?DOCUMENSO_POSTGRES_PASSWORD manquant}
      POSTGRES_DB: ${DOCUMENSO_POSTGRES_DB:?DOCUMENSO_POSTGRES_DB manquant}
    volumes:
      - documenso_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DOCUMENSO_POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Stockage S3-compatible requis pour que l'API v1 de Documenso puisse
  # exposer un lien de téléchargement du PDF signé (GET
  # /api/v1/documents/:id/download) : ce endpoint refuse de fonctionner avec
  # le transport "database" par défaut (vérifié dans son code source), d'où
  # ce service supplémentaire plutôt qu'une option de config.
  documenso-minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${DOCUMENSO_MINIO_ROOT_USER:?DOCUMENSO_MINIO_ROOT_USER manquant}
      MINIO_ROOT_PASSWORD: ${DOCUMENSO_MINIO_ROOT_PASSWORD:?DOCUMENSO_MINIO_ROOT_PASSWORD manquant}
    volumes:
      - documenso_minio_data:/data
    ports:
      - "127.0.0.1:9002:9000"
      - "127.0.0.1:9003:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Capture SMTP locale (aucun serveur mail réel configuré pour l'instant,
  # voir bilan de session) : Documenso peut démarrer et tenter d'envoyer ses
  # emails internes sans échouer ni bloquer le parcours — l'application
  # n'utilise de toute façon jamais l'email natif de Documenso pour inviter à
  # signer (elle redirige directement vers le `signingUrl` retourné par
  # l'API, voir src/lib/documenso.ts), donc l'absence de SMTP réel ici n'a
  # aucun impact sur le parcours de signature lui-même.
  documenso-mail:
    image: maildev/maildev:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:1080:1080"

  documenso:
    image: documenso/documenso:latest
    restart: unless-stopped
    depends_on:
      documenso-db:
        condition: service_healthy
      documenso-minio:
        condition: service_healthy
    environment:
      PORT: "3000"
      NEXTAUTH_SECRET: ${DOCUMENSO_NEXTAUTH_SECRET:?DOCUMENSO_NEXTAUTH_SECRET manquant}
      NEXT_PRIVATE_ENCRYPTION_KEY: ${DOCUMENSO_ENCRYPTION_KEY:?DOCUMENSO_ENCRYPTION_KEY manquant}
      NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY: ${DOCUMENSO_ENCRYPTION_SECONDARY_KEY:?DOCUMENSO_ENCRYPTION_SECONDARY_KEY manquant}
      NEXT_PUBLIC_WEBAPP_URL: ${DOCUMENSO_WEBAPP_URL:?DOCUMENSO_WEBAPP_URL manquant}
      # Sans ceci, Documenso construit l'URL de ses appels internes (jobs —
      # notamment le scellement du document après signature, voir
      # packages/lib/jobs/client/local.ts#submitJobToEndpoint) à partir de
      # NEXT_PUBLIC_WEBAPP_URL ci-dessus, qui vaut localhost:3100 — le port
      # PUBLIÉ sur l'hôte, injoignable depuis l'intérieur même du conteneur
      # (qui écoute en interne sur le port 3000, voir PORT ci-dessous).
      # Chaque job se soumet donc lui-même à une URL qui refuse la connexion,
      # avec l'erreur avalée en silence (fetch avec .catch(() => null) et un
      # timeout de 150ms côté Documenso) : la seule conséquence observable
      # est qu'un document signé reste bloqué en PENDING indéfiniment, sans
      # jamais déclencher le webhook DOCUMENT_COMPLETED — constaté en session
      # (voir bilan) avant l'ajout de cette variable.
      NEXT_PRIVATE_INTERNAL_WEBAPP_URL: "http://localhost:3000"
      NEXT_PRIVATE_DATABASE_URL: "postgres://${DOCUMENSO_POSTGRES_USER}:${DOCUMENSO_POSTGRES_PASSWORD}@documenso-db:5432/${DOCUMENSO_POSTGRES_DB}"
      NEXT_PRIVATE_DIRECT_DATABASE_URL: "postgres://${DOCUMENSO_POSTGRES_USER}:${DOCUMENSO_POSTGRES_PASSWORD}@documenso-db:5432/${DOCUMENSO_POSTGRES_DB}"
      NEXT_PRIVATE_SIGNING_TRANSPORT: local
      NEXT_PRIVATE_SIGNING_LOCAL_FILE_PATH: /opt/documenso/cert.p12
      NEXT_PRIVATE_SIGNING_PASSPHRASE: ${DOCUMENSO_SIGNING_PASSPHRASE:?DOCUMENSO_SIGNING_PASSPHRASE manquant}
      NEXT_PUBLIC_UPLOAD_TRANSPORT: s3
      NEXT_PRIVATE_UPLOAD_ENDPOINT: "http://documenso-minio:9000"
      NEXT_PRIVATE_UPLOAD_FORCE_PATH_STYLE: "true"
      NEXT_PRIVATE_UPLOAD_REGION: "us-east-1"
      NEXT_PRIVATE_UPLOAD_BUCKET: "documenso"
      NEXT_PRIVATE_UPLOAD_ACCESS_KEY_ID: ${DOCUMENSO_MINIO_ROOT_USER}
      NEXT_PRIVATE_UPLOAD_SECRET_ACCESS_KEY: ${DOCUMENSO_MINIO_ROOT_PASSWORD}
      # Autorise le webhook à cibler l'app en développement (adresse privée,
      # bloquée par défaut contre le SSRF) : la gateway du réseau Docker
      # compose (172.19.0.1, voir bilan de session) le temps d'itérer avec
      # `npm run dev`, et le nom de service interne `app` pour le
      # déploiement conteneurisé réel (voir DOCUMENSO_WEBHOOK_SSRF_BYPASS_HOSTS
      # dans .env, à ajuster si le sous-réseau Docker change).
      NEXT_PRIVATE_WEBHOOK_SSRF_BYPASS_HOSTS: ${DOCUMENSO_WEBHOOK_SSRF_BYPASS_HOSTS:-172.19.0.1,app}
      NEXT_PRIVATE_SMTP_TRANSPORT: smtp-auth
      NEXT_PRIVATE_SMTP_HOST: documenso-mail
      NEXT_PRIVATE_SMTP_PORT: "1025"
      NEXT_PRIVATE_SMTP_FROM_NAME: "L'Orée du Savoir"
      NEXT_PRIVATE_SMTP_FROM_ADDRESS: "inscriptions@loreedusavoir.local"
      DOCUMENSO_DISABLE_TELEMETRY: "true"
    volumes:
      - ./documenso-cert/cert.p12:/opt/documenso/cert.p12:ro
    ports:
      - "127.0.0.1:3100:3000"

volumes:
  db_data:
  n8n_data:
  documenso_db_data:
  documenso_minio_data:
